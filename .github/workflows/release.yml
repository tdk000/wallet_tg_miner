name: Release APK

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK 28
        run: sdkmanager "ndk;28.2.13676358"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: android/app/build/outputs/apk/debug/app-debug.apk

  # Prebuilt CLI binaries for Linux.  Static, so they run on any glibc or musl
  # distribution without a compiler and without installing anything.  Both are
  # self-tested before upload: the x86_64 one natively, the aarch64 one under
  # qemu, so a release can never ship a binary whose crypto vectors do not match.
  cli-linux:
    name: CLI binaries (Linux)
    runs-on: ubuntu-22.04   # g++ 11 -> glibc 2.35, the oldest still-supported LTS
    needs: release          # upload to the release created by the APK job
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cross compiler and qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-aarch64-linux-gnu qemu-user-static

      - name: Build x86_64 (static)
        run: |
          g++ -std=c++17 -O3 -pthread -static \
            wallet_tg_miner.cpp gpu_opencl.cpp monocypher.c \
            -o wallet_tg_miner_linux_x86_64 -ldl
          strip wallet_tg_miner_linux_x86_64
          ./wallet_tg_miner_linux_x86_64 --selftest

      - name: Build aarch64 (static)
        run: |
          aarch64-linux-gnu-g++ -std=c++17 -O3 -pthread -static \
            wallet_tg_miner.cpp gpu_opencl.cpp monocypher.c \
            -o wallet_tg_miner_linux_aarch64 -ldl
          aarch64-linux-gnu-strip wallet_tg_miner_linux_aarch64
          qemu-aarch64-static ./wallet_tg_miner_linux_aarch64 --selftest

      - name: Package tarballs
        # The archive holds a single file called "wallet-tg" with the exec bit
        # already set, so installing is just `curl -Ls <url> | tar xz` — no
        # chmod, no rename, no compiler.  The archive name is stable (no
        # version), so /releases/latest/download/<name> keeps working forever.
        run: |
          mkdir -p pkg
          cp wallet_tg_miner_linux_x86_64 pkg/wallet-tg
          tar --owner=0 --group=0 --numeric-owner -czf wallet-tg-linux-x86_64.tar.gz -C pkg wallet-tg
          cp wallet_tg_miner_linux_aarch64 pkg/wallet-tg
          tar --owner=0 --group=0 --numeric-owner -czf wallet-tg-linux-aarch64.tar.gz -C pkg wallet-tg
          echo "--- archive contents ---"
          tar tzvf wallet-tg-linux-x86_64.tar.gz
          # Smoke test: unpack exactly like a user does and run the self-test.
          mkdir -p /tmp/unpack && tar xzf wallet-tg-linux-x86_64.tar.gz -C /tmp/unpack
          /tmp/unpack/wallet-tg --selftest
          ls -l wallet-tg-linux-*.tar.gz

      - name: Publish CLI binaries
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: |
            wallet-tg-linux-x86_64.tar.gz
            wallet-tg-linux-aarch64.tar.gz
            wallet_tg_miner_linux_x86_64
            wallet_tg_miner_linux_aarch64

  # Windows build.  Before this job existed the .exe was attached by hand, so a
  # release could easily ship without it (v1.3.2 and v1.3.3 did) and Windows
  # users were left guessing.  /MT links the C runtime statically, so the exe
  # runs on a clean machine without the VC++ redistributable; /utf-8 keeps the
  # Russian messages intact.
  cli-windows:
    name: CLI binary (Windows)
    runs-on: windows-latest
    needs: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        run: >
          cl /nologo /std:c++17 /O2 /EHsc /MT /utf-8
          wallet_tg_miner.cpp gpu_opencl.cpp monocypher.c
          /Fe:wallet_tg_miner.exe advapi32.lib

      - name: Self-test
        shell: pwsh
        run: |
          $out = ./wallet_tg_miner.exe --selftest
          $out | Select-Object -Last 3
          if ($LASTEXITCODE -ne 0) { throw "self-test exited with $LASTEXITCODE" }
          if (-not ($out -match 'all self-tests passed')) { throw "self-test did not report success" }

      - name: Package zip
        shell: pwsh
        run: |
          # wallet_tg_miner.exe is the tool itself (double-click opens the wizard),
          # start.bat is the classic menu.  Both stay in one folder, nothing to install.
          Compress-Archive -Path wallet_tg_miner.exe, start.bat -DestinationPath wallet-tg-windows-x86_64.zip -Force
          Get-Item wallet_tg-windows-x86_64.zip | Format-Table Name, Length
          Get-ChildItem wallet_tg_miner.exe, start.bat | Format-Table Name, Length

      - name: Publish CLI binary
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: wallet-tg-windows-x86_64.zip

