plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wallettg.miner'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId "com.wallettg.miner"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2.1"

        ndk {
            // Covers the vast majority of phones in use.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                // Statically link libc++ so the .so has no extra runtime dep.
                arguments "-DANDROID_STL=c++_static"
                cFlags "-O3"
                cppFlags "-O3"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            // no-op
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }
}
